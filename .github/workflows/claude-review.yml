name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Uses a Claude Pro/Max subscription token if set, otherwise an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for AidLedger, a Next.js (App Router, TypeScript,
            Tailwind) app built by a team of interns. Be constructive and specific.

            Review for:
            - Bugs and logic errors
            - Security and privacy (no secrets, no real personal data, proper access checks)
            - Next.js / React best practices (server vs client components, data fetching)
            - TypeScript types, readability, and naming
            - Missing tests or obvious edge cases

            Post ONE short comment on the PR with only a Summary of what the PR does (2-3 lines).
            Do not include a verdict, issues, recommendations or inline comments. Those are reported privately.
            Use `gh pr comment` to post it.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Uses a Claude Pro/Max subscription token if set, otherwise an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for AidLedger, a Next.js (App Router, TypeScript,
            Tailwind) app built by a team of interns. Be constructive and specific.

            Review for:
            - Bugs and logic errors
            - Security and privacy (no secrets, no real personal data, proper access checks)
            - Next.js / React best practices (server vs client components, data fetching)
            - TypeScript types, readability, and naming
            - Missing tests or obvious edge cases

            Post ONE summary comment on the PR with these sections:
            1. Summary (what the PR does, 2-3 lines)
            2. Verdict: "Ready to merge", "Merge after small fixes", or "Needs changes"
            3. Issues found (most severe first, with file:line)
            4. Recommendations
            Use inline comments for specific lines when helpful.
            Use `gh pr comment` for the summary and the inline comment tool for line comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

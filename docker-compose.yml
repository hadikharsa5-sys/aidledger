services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aidledger
      POSTGRES_PASSWORD: aidledger
      POSTGRES_DB: aidledger_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  pgdata:
